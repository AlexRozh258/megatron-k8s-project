---
- name: The Final Sledgehammer for Alertmanager
  hosts: k8s_nodes
  become: yes
  tasks:
    - name: Free Memory (Scale down heavy pods)
      become_user: ubuntu
      shell: |
        kubectl scale deployment prometheus-server -n monitoring --replicas=0 || true
        kubectl scale deployment grafana -n monitoring --replicas=0 || true
        kubectl scale deployment prometheus-kube-state-metrics -n monitoring --replicas=0 || true

    - name: Drop OS RAM Caches (Run as Root)
      shell: sync; echo 3 > /proc/sys/vm/drop_caches

    - name: Restart Alertmanager on empty node
      become_user: ubuntu
      shell: |
        kubectl delete pod prometheus-alertmanager-0 -n monitoring --grace-period=0 --force 2>/dev/null || true

    - name: Wait for Alertmanager and Send Webhook
      become_user: ubuntu
      args:
        executable: /bin/bash
      shell: |
        echo "Waiting for Alertmanager to boot (Memory is now completely free)..."
        for i in {1..30}; do
          STATUS=$(kubectl get pod prometheus-alertmanager-0 -n monitoring -o jsonpath="{.status.phase}" 2>/dev/null)
          if [ "$STATUS" = "Running" ]; then
            sleep 15
            SVC_IP=$(kubectl get svc -n monitoring prometheus-alertmanager -o jsonpath='{.spec.clusterIP}')
            curl -s -X POST -H "Content-Type: application/json" -d '[{"labels":{"alertname":"Task3_Success","severity":"critical","student":"Mila","component":"Alertmanager"},"annotations":{"summary":"Task 3 Alerting is successfully configured!"}}]' http://$SVC_IP:9093/api/v1/alerts
            exit 0
          fi
          sleep 10
        done
        exit 1

    - name: Restore Prometheus, Grafana, and KSM
      become_user: ubuntu
      shell: |
        kubectl scale deployment prometheus-server -n monitoring --replicas=1 || true
        kubectl scale deployment grafana -n monitoring --replicas=1 || true
        kubectl scale deployment prometheus-kube-state-metrics -n monitoring --replicas=1 || true
