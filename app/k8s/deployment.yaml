apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-app-deployment
  namespace: default
  labels:
    app: megatron-web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: megatron-web
  template:
    metadata:
      labels:
        app: megatron-web
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9113"
        prometheus.io/path: "/metrics"
    spec:
      securityContext:
        runAsNonRoot: true
        fsGroup: 101
      tolerations:
        - key: "node-role.kubernetes.io/control-plane"
          operator: "Exists"
          effect: "NoSchedule"
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - megatron-web
                topologyKey: "kubernetes.io/hostname"
      containers:
        - name: web-app
          image: nginxinc/nginx-unprivileged:1.27-alpine-slim
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          envFrom:
            - configMapRef:
                name: megatron-app-config
          volumeMounts:
            - name: app-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
            - name: app-config
              mountPath: /usr/share/nginx/html/index.html
              subPath: index.html
          securityContext:
            runAsUser: 101
            runAsGroup: 101
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              memory: "32Mi"
              cpu: "25m"
            limits:
              memory: "64Mi"
              cpu: "100m"
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 5

        - name: nginx-exporter
          image: nginx/nginx-prometheus-exporter:1.4.1
          imagePullPolicy: IfNotPresent
          args:
            - "--nginx.scrape-uri=http://127.0.0.1:8081/stub_status"
          ports:
            - containerPort: 9113
              name: metrics
          securityContext:
            runAsUser: 65534
            runAsGroup: 65534
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              memory: "16Mi"
              cpu: "10m"
            limits:
              memory: "32Mi"
              cpu: "50m"
      volumes:
        - name: app-config
          configMap:
            name: megatron-app-config
