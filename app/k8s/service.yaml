apiVersion: v1
kind: Service
metadata:
  name: web-app-service
  namespace: default
  labels:
    app: megatron-web
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "9113"
    prometheus.io/path: "/metrics"
spec:
  type: NodePort
  selector:
    app: megatron-web
  ports:
    - name: http
      port: 80
      targetPort: 8080
      nodePort: 30080
    - name: metrics
      port: 9113
      targetPort: 9113
