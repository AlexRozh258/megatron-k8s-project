apiVersion: v1
kind: Pod
metadata:
  name: qa-logging-smoke
  namespace: default
  labels:
    app: qa-logging-smoke
spec:
  restartPolicy: Never
  containers:
    - name: logger
      image: busybox:1.36
      command:
        - /bin/sh
        - -c
        - |
          echo '{"level":"info","source":"qa-smoke","msg":"QA_K8S_LOG_PIPELINE_CHECK"}'
          sleep 10
